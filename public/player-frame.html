<!doctype html>
<!--
  Hosts the YouTube player inside the Picture-in-Picture window. The PiP
  document is about:blank, so a YouTube embed placed directly in it sends no
  referrer and YouTube refuses to play (error 153). This same-origin page gives
  the embed a real referrer; app.js drives the player through contentWindow.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body></body>
</html>
